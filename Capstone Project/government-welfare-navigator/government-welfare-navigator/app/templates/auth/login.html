{% extends 'base.html' %}{% block title %}Sign in{% endblock %}
{% block content %}
<div class="container section" style="max-width:460px">
  <div class="card p-4"><h1 class="h4">Sign in</h1>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" required autocomplete="email"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" required autocomplete="current-password"></div>
    <button class="btn btn-primary w-100" type="submit" data-loading><span class="spinner-border spinner-border-sm spinner-inline" aria-hidden="true"></span> <span class="btn-label">Sign in</span></button>
  </form>
  <div class="d-flex justify-content-between mt-3"><a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a><a href="{{ url_for('auth.register') }}">Create account</a></div></div>
</div>{% endblock %}
