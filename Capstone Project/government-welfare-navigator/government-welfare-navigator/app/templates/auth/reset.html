{% extends 'base.html' %}{% block title %}Set new password{% endblock %}
{% block content %}
<div class="container section" style="max-width:460px"><div class="card p-4"><h1 class="h4">Set a new password</h1>
<form method="post" class="needs-validation" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="password">New password</label><input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password"><div class="form-text">At least 8 characters with a letter and a number.</div></div>
<div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"></div>
<button class="btn btn-primary w-100" type="submit">Update password</button></form></div></div>{% endblock %}
