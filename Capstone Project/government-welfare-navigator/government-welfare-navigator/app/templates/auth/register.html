{% extends 'base.html' %}{% block title %}Create account{% endblock %}
{% block content %}
<div class="container section" style="max-width:520px">
  <div class="card p-4"><h1 class="h4">Create your account</h1><p class="text-muted">Free. We only collect what is needed to match schemes.</p>
  <form method="post" class="needs-validation" novalidate>
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-3"><label class="form-label" for="full_name">Full name</label><input class="form-control" id="full_name" name="full_name" required minlength="2" maxlength="120" value="{{ form.get('full_name','') }}" autocomplete="name"></div>
    <div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" required maxlength="254" value="{{ form.get('email','') }}" autocomplete="email"></div>
    <div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" type="password" id="password" name="password" required minlength="8" autocomplete="new-password"><div class="form-text">At least 8 characters with a letter and a number.</div></div>
    <div class="mb-3"><label class="form-label" for="confirm_password">Confirm password</label><input class="form-control" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"></div>
    <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="consent" name="consent" required><label class="form-check-label" for="consent">I understand my profile details are used only for scheme matching and that results are preliminary.</label></div>
    <button class="btn btn-primary w-100" type="submit" data-loading><span class="spinner-border spinner-border-sm spinner-inline" aria-hidden="true"></span> <span class="btn-label">Create account</span></button>
  </form>
  <p class="mt-3 mb-0 text-center">Already registered? <a href="{{ url_for('auth.login') }}">Sign in</a></p></div>
</div>{% endblock %}
