{% extends 'base.html' %}{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="container section" style="max-width:460px"><div class="card p-4"><h1 class="h4">Reset your password</h1>
<p class="text-muted">Enter your account email. If it exists, we will send a reset link valid for one hour.</p>
<form method="post" class="needs-validation" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" type="email" id="email" name="email" required></div>
<button class="btn btn-primary w-100" type="submit">Send reset link</button></form>
<p class="mt-3 mb-0 text-center"><a href="{{ url_for('auth.login') }}">Back to sign in</a></p></div></div>{% endblock %}
